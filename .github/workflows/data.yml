# Weekly refresh of the static data (stations + train index) from ÖBB open data GTFS.
# Opens a PR when packages/*/data changed; review the diff and merge.
name: data

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp install --frozen-lockfile

      - name: Import GTFS into SQLite (.cache/zugx.sqlite)
        run: vp run db:build

      - name: Build stations
        run: vp run stations:build

      - name: Build train index
        run: vp run trains:build

      - name: Build departure posters
        run: vp run departures:build

      - name: Build train → line map
        run: vp run lines:build

      - name: Build Netzgrafik + corridors
        run: vp run netz:build

      - name: Export routing input (timetable search)
        run: vp run route:export

      - name: Test data
        run: |
          vp test run --root packages/stations
          vp test run --root packages/trains
          vp test run --root packages/netz

      - name: Open PR
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: data/refresh
          delete-branch: true
          add-paths: packages/*/data/**
          commit-message: "data: weekly refresh from ÖBB GTFS"
          title: "data: weekly refresh from ÖBB GTFS"
          body: |
            Automated refresh of `packages/*/data` (stations, trains, departure plans, lines,
            Bildfahrplan sheets, routing input). Review the diff before merging.
          labels: data
