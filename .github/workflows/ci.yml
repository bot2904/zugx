name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: vp check
      - run: vp run -r typecheck
      - run: vp run -r test
      - run: vp run --filter @zugx/web build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm --filter @zugx/e2e exec playwright install --with-deps chromium
      - run: vp run --filter @zugx/e2e e2e
      # screenshots, traces and error context of failed tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

  image:
    needs: [check, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          echo "hash=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Vienna git log -1 --date='format-local:%Y-%m-%d %H:%M' --format=%cd)" >> "$GITHUB_OUTPUT"
      - uses: redhat-actions/buildah-build@v2
        id: build
        with:
          build-args: |
            VITE_COMMIT_HASH=${{ steps.version.outputs.hash }}
            VITE_COMMIT_DATE=${{ steps.version.outputs.date }}
          image: zugx
          tags: latest ${{ github.sha }}
          containerfiles: deploy/Containerfile
      - uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
